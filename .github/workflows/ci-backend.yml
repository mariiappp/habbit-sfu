(name: ci-backend)

on:
	push:
		paths:
			- "backend/**"
			- ".github/workflows/ci-backend.yml"
	pull_request:
		paths:
			- "backend/**"
			- ".github/workflows/ci-backend.yml"

jobs:
	test:
		runs-on: ubuntu-latest
		defaults:
			run:
				working-directory: backend
		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Set up Python
				uses: actions/setup-python@v5
				with:
					python-version: "3.13"

			- name: Install Poetry
				run: |
					python -m pip install --upgrade pip
					pip install poetry

			- name: Install dependencies
				env:
					POETRY_IGNORE_PYTHON_VERSION: "1"
				run: |
					poetry install --with dev --no-interaction --no-ansi

			- name: Run tests
				env:
					POETRY_IGNORE_PYTHON_VERSION: "1"
				run: |
					poetry run pytest -q
